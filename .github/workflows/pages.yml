name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling a deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # A dashboard backed by failing engines should not ship.
      - name: Test
        run: npm test

      # Publish only the dashboard and the browser-safe engine modules it imports, not the whole
      # repository. .nojekyll serves the files as-is.
      - name: Assemble site
        run: |
          mkdir -p _site/src/engines
          cp dashboard.html _site/index.html
          cp src/engines/*.js _site/src/engines/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
