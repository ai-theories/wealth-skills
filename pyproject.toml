[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wealth-skills"
version = "0.1.0"
description = "Enterprise AI skill library and Model Context Protocol tools for US Wealth Management."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["wealth-management", "ai-agents", "mcp", "financial-planning", "portfolio-rebalance"]
authors = [
  { name = "WealthSkills AI", email = "admin@wealthskills.ai" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment"
]

[project.urls]
Homepage = "https://github.com/ai-theories/wealth-skills"
Documentation = "https://github.com/ai-theories/wealth-skills/tree/main/docs"
